name: Deploy BrioNest to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static files and configure API endpoint
        env:
          API_BASE_URL: ${{ vars.BRIONEST_API_BASE_URL }}
        run: |
          mkdir -p dist
          cp index.html styles.css site.js dist/
          node -e "require('fs').writeFileSync('dist/config.js','window.BRIONEST_API_BASE_URL = '+JSON.stringify(process.env.API_BASE_URL||'')+';\\n')"
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment